services:
  ruview:
    build:
      context: .
      dockerfile: Dockerfile

    network_mode: host

    cap_add:
      - NET_ADMIN
      - NET_RAW

    environment:
      - SENSING_WIFI_IFACE=${SENSING_WIFI_IFACE:-}
      - SENSING_WIFI_USE_DUMP=${SENSING_WIFI_USE_DUMP:-true}

    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models

    labels:
      ai-tool: "ruview"

    command:
      - /app/sensing-server
      - --http-port
      - "3001"
      - --ws-port
      - "3002"
      - --bind-addr
      - 0.0.0.0
      - --disable-host-validation
      - --ui-path
      - /app/ui
      - --source
      - wifi

    restart: unless-stopped
