services:
  ruview:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CSI_SOURCE: ${CSI_SOURCE:-auto}
      MODELS_DIR: ${MODELS_DIR:-data/models}

    ports:
      - "3000:3000"
      - "3001:3001"
      - "5005:5005/udp"

    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models

    labels:
      ai-tool: "ruview"
    environment:
      - SENSING_ALLOWED_HOSTS=Babou,192.168.50.191,gail,192.168.50.249,localhost,127.0.0.1
    command:
      - wifi-densepose-sensing-server
      - --allowed-host
      - 192.168.50.249
      - --allowed-host
      - localhost
      - --allowed-host
      - 127.0.0.1
    restart: unless-stopped
