services:
  ruview:
    build:
      context: .
      dockerfile: Dockerfile
    image: wifi-densepose:local

    environment:
      CSI_SOURCE: ${CSI_SOURCE:-auto}
      MODELS_DIR: ${MODELS_DIR:-data/models}

    ports:
      - "3000:3000"
      - "3001:3001"
      - "5005:5005/udp"

    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models

    labels:
      ai-tool: "ruview"

    restart: unless-stopped
