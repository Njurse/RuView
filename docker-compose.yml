services:
  ruview:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3010:3000"
      - "3001:3001"
      - "5005:5005/udp"

    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models

    labels:
      ai-tool: "ruview"

    command:
      - /app/sensing-server
      - --http-port
      - "3000"
      - --ws-port
      - "3001"
      - --udp-port
      - "5005"
      - --bind-addr
      - 0.0.0.0
      - --source
      - esp32
      - --disable-host-validation

    restart: unless-stopped