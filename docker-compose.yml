services:
  ruview:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3000:3000"
      - "3001:3001"
      - "5005:5005/udp"

    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models

    labels:
      ai-tool: "ruview"

    command:
      - /app/sensing-server
      - --http-port
      - "3000"
      - --ws-port
      - "3001"
      - --allowed-host
      - 192.168.50.249
      - --allowed-host
      - 192.168.50.191
      - --allowed-host
      - localhost
      - --allowed-host
      - 127.0.0.1

    restart: unless-stopped